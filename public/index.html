<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Clash · OOP Battle</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <section id="screen-menu" class="screen active"></section>
    <section id="screen-lobby" class="screen"></section>
    <section id="screen-battle" class="screen"></section>
    <section id="screen-result" class="screen"></section>
  </div>

  <button id="sound-toggle" class="icon-btn" title="Toggle sound" aria-label="Toggle sound">
    <svg id="spk-on" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
    <svg id="spk-off" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none"><path d="M3 10v4h4l5 5V5L7 10H3zm13.6 2 2.7-2.7-1.4-1.4L15.2 10.6 12.5 7.9 11.1 9.3l2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4L16.6 12z"/></svg>
  </button>

  <div id="emote-layer" class="emote-layer"></div>

  <script src="js/config.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/fighter.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
